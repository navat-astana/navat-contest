<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAVAT — Конкурс</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Montserrat', Arial, sans-serif;
  background: #1b3d3e;
  color: #f5e4b2;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 22px;
}

.page {
  width: 100%;
  max-width: 430px;
  text-align: center;
}

/* ЗОЛОТАЯ ЗВЕЗДА-РОЗЕТКА */
.star {
  width: 76px;
  height: 76px;
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,.25));
}

.star svg {
  width: 100%;
  height: 100%;
}

.logo {
  font-size: 44px;
  font-weight: 800;
  letter-spacing: 8px;
  color: #e5c16a;
  margin-left: 8px;
}

.subtitle {
  margin-top: 7px;
  color: #f5e4b2;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: .9;
}

.card {
  margin-top: 28px;
  padding: 28px 22px 24px;
  border: 1px solid rgba(229,193,106,.45);
  border-radius: 24px;
  background: rgba(10,39,25,.72);
  box-shadow:
    0 20px 60px rgba(0,0,0,.30),
    inset 0 0 30px rgba(229,193,106,.03);
  backdrop-filter: blur(12px);
}

.title {
  font-size: 24px;
  font-weight: 800;
  color: #fff4d3;
  margin-bottom: 9px;
}

.description {
  font-size: 13px;
  line-height: 1.6;
  color: #d9cda9;
  margin-bottom: 25px;
}

label {
  display: block;
  text-align: left;
  color: #e5c16a;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  margin: 17px 0 8px;
}

input {
  width: 100%;
  height: 53px;
  border-radius: 13px;
  border: 1px solid rgba(229,193,106,.35);
  background: rgba(255,255,255,.07);
  color: white;
  padding: 0 16px;
  font-family: inherit;
  font-size: 15px;
  outline: none;
}

input::placeholder {
  color: rgba(255,255,255,.45);
}

input:focus {
  border-color: #e5c16a;
  box-shadow: 0 0 0 3px rgba(229,193,106,.10);
}

.consent {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin: 20px 0 0;
  text-align: left;
  color: #d9cda9;
  font-size: 11.5px;
  font-weight: 400;
  letter-spacing: normal;
  line-height: 1.5;
  cursor: pointer;
}

.consent input[type="checkbox"] {
  width: 18px;
  height: 18px;
  min-width: 18px;
  margin: 1px 0 0;
  accent-color: #e5c16a;
  cursor: pointer;
}

button {
  width: 100%;
  height: 57px;
  margin-top: 27px;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(135deg, #f1d27b, #c99d3d);
  color: #173521;
  font-family: inherit;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
}

button:active {
  transform: scale(.98);
}

button:disabled {
  opacity: .6;
}

.error {
  color: #ffb4a8;
  font-size: 12px;
  margin-top: 13px;
}

/* РЕЗУЛЬТАТ */

.result {
  display: none;
}

.success-card {
  margin-top: 28px;
  padding: 35px 22px;
  border: 1px solid rgba(229,193,106,.45);
  border-radius: 24px;
  background: rgba(10,39,25,.75);
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.success-icon {
  font-size: 48px;
  margin-bottom: 12px;
}

.success-title {
  font-size: 23px;
  font-weight: 800;
  color: #fff4d3;
}

.number-label {
  margin-top: 25px;
  color: #d9cda9;
  font-size: 13px;
}

.number {
  margin-top: 5px;
  font-size: 76px;
  font-weight: 800;
  line-height: 1;
  color: #e5c16a;
  text-shadow: 0 5px 20px rgba(0,0,0,.3);
}

.save-text {
  margin-top: 20px;
  color: #d9cda9;
  font-size: 12px;
}

.footer {
  margin-top: 20px;
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(229,193,106,.55);
}

.ig-link {
  display: inline-block;
  margin-top: 6px;
  color: #e5c16a;
  text-decoration: none;
  letter-spacing: 1px;
  font-weight: 600;
}

.ig-link:hover {
  text-decoration: underline;
}
</style>
</head>

    digits = "7" + digits.slice(1);
  }

  if (digits.length === 10) {
    digits = "7" + digits;
  }

  if (digits.length !== 11 || digits[0] !== "7") {
    return null;
  }

  return "+" + digits;
}

function normalizeInstagram(raw) {
  let value = raw.trim();

  if (value.startsWith("@")) {
    value = value.slice(1);
  }

  const valid = /^[A-Za-z0-9._]{1,30}$/.test(value);

  if (!valid) {
    return null;
  }

  return "@" + value;
}

form.addEventListener("submit", async function(e) {

  e.preventDefault();

  error.textContent = "";

  const consent = document.getElementById("consent");

  if (!consent.checked) {
    error.textContent =
      "Нужно согласие на обработку персональных данных";
    return;
  }

  const fullName =
    document.getElementById("full_name").value.trim();

  const phoneRaw =
    document.getElementById("phone").value.trim();

  const instagramRaw =
    document.getElementById("instagram").value.trim();

  const phone = normalizePhone(phoneRaw);

  if (!phone) {
    error.textContent =
      "Введите корректный номер телефона, например +7 700 000 00 00";
    return;
  }

  const instagram = normalizeInstagram(instagramRaw);

  if (!instagram) {
    error.textContent =
      "Введите корректный Instagram, например @username";
    return;
  }

  button.disabled = true;
  button.textContent = "РЕГИСТРАЦИЯ...";

  try {

    const dupResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/participants?select=participant_number&phone=eq.${encodeURIComponent(phone)}&limit=1`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!dupResponse.ok) {
      const details = await dupResponse.text();
      throw new Error(
        "Supabase: " +
        dupResponse.status +
        " — " +
        details
      );
    }

    const dup = await dupResponse.json();

    if (dup.length > 0) {
      error.textContent =
        "Этот номер телефона уже зарегистрирован в конкурсе";
      button.disabled = false;
      button.textContent = "ПОЛУЧИТЬ НОМЕР";
      return;
    }

    const checkResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/participants?select=participant_number&order=participant_number.desc&limit=1`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!checkResponse.ok) {
      const details = await checkResponse.text();
      throw new Error(
        "Supabase: " +
        checkResponse.status +
        " — " +
        details
      );
    }

    const previous = await checkResponse.json();

    let nextNumber = 1;

    if (
      previous.length > 0 &&
      previous[0].participant_number
    ) {
      nextNumber =
        Number(previous[0].participant_number) + 1;
    }

    const saveResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/participants`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Prefer": "return=representation"
        },

        body: JSON.stringify({
          full_name: fullName,
          phone: phone,
          instagram: instagram,
          participant_number: nextNumber
        })
      }
    );

    if (!saveResponse.ok) {
      const details = await saveResponse.text();

      throw new Error(
        "Supabase: " +
        saveResponse.status +
        " — " +
        details
      );
    }

    document.getElementById("registration")
      .style.display = "none";

    document.getElementById("result")
      .style.display = "block";

    document.getElementById("participantNumber")
      .textContent =
      String(nextNumber).padStart(3, "0");

  } catch (err) {

    console.error(err);

    error.textContent =
      "Ошибка: " + err.message;

    button.disabled = false;
    button.textContent = "ПОЛУЧИТЬ НОМЕР";
  }

});

</script>
