<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAVAT — Конкурс</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap');

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Montserrat', Arial, sans-serif;
  background:
    radial-gradient(circle at 50% 0%, #315d43 0%, #183b29 42%, #0d281b 100%);
  color: #f5e4b2;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 22px;
}

.page {
  width: 100%;
  max-width: 430px;
  text-align: center;
}

/* ЗОЛОТАЯ ЗВЕЗДА */
.star {
  width: 76px;
  height: 76px;
  margin: 0 auto 12px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #e5c16a;
  font-size: 64px;
  line-height: 1;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,.25));
}

.logo {
  font-size: 44px;
  font-weight: 800;
  letter-spacing: 8px;
  color: #e5c16a;
  margin-left: 8px;
}

.subtitle {
  margin-top: 7px;
  color: #f5e4b2;
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: .9;
}

.card {
  margin-top: 28px;
  padding: 28px 22px 24px;
  border: 1px solid rgba(229,193,106,.45);
  border-radius: 24px;
  background: rgba(10,39,25,.72);
  box-shadow:
    0 20px 60px rgba(0,0,0,.30),
    inset 0 0 30px rgba(229,193,106,.03);
  backdrop-filter: blur(12px);
}

.title {
  font-size: 24px;
  font-weight: 800;
  color: #fff4d3;
  margin-bottom: 9px;
}

.description {
  font-size: 13px;
  line-height: 1.6;
  color: #d9cda9;
  margin-bottom: 25px;
}

label {
  display: block;
  text-align: left;
  color: #e5c16a;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  margin: 17px 0 8px;
}

input {
  width: 100%;
  height: 53px;
  border-radius: 13px;
  border: 1px solid rgba(229,193,106,.35);
  background: rgba(255,255,255,.07);
  color: white;
  padding: 0 16px;
  font-family: inherit;
  font-size: 15px;
  outline: none;
}

input::placeholder {
  color: rgba(255,255,255,.45);
}

input:focus {
  border-color: #e5c16a;
  box-shadow: 0 0 0 3px rgba(229,193,106,.10);
}

button {
  width: 100%;
  height: 57px;
  margin-top: 27px;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(135deg, #f1d27b, #c99d3d);
  color: #173521;
  font-family: inherit;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
}

button:active {
  transform: scale(.98);
}

button:disabled {
  opacity: .6;
}

.error {
  color: #ffb4a8;
  font-size: 12px;
  margin-top: 13px;
}

/* РЕЗУЛЬТАТ */

.result {
  display: none;
}

.success-card {
  margin-top: 28px;
  padding: 35px 22px;
  border: 1px solid rgba(229,193,106,.45);
  border-radius: 24px;
  background: rgba(10,39,25,.75);
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.success-icon {
  font-size: 48px;
  margin-bottom: 12px;
}

.success-title {
  font-size: 23px;
  font-weight: 800;
  color: #fff4d3;
}

.number-label {
  margin-top: 25px;
  color: #d9cda9;
  font-size: 13px;
}

.number {
  margin-top: 5px;
  font-size: 76px;
  font-weight: 800;
  line-height: 1;
  color: #e5c16a;
  text-shadow: 0 5px 20px rgba(0,0,0,.3);
}

.save-text {
  margin-top: 20px;
  color: #d9cda9;
  font-size: 12px;
}

.footer {
  margin-top: 20px;
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(229,193,106,.55);
}
</style>
</head>

<body>

<div class="page">

  <div id="registration">

    <div class="star">★</div>

    <div class="logo">NAVAT</div>

    <div class="subtitle">
      Чайхана
    </div>

    <div class="card">

      <div class="title">
        УЧАСТВУЙ В КОНКУРСЕ
      </div>

      <div class="description">
        Заполни данные ниже и получи
        свой уникальный номер участника.
      </div>

      <form id="form">

        <label>ФИО</label>
        <input
          type="text"
          id="full_name"
          placeholder="Введите ФИО"
          required
        >

        <label>НОМЕР ТЕЛЕФОНА</label>
        <input
          type="tel"
          id="phone"
          placeholder="+7 700 000 00 00"
          required
        >

        <label>INSTAGRAM</label>
        <input
          type="text"
          id="instagram"
          placeholder="@username"
          required
        >

        <button type="submit" id="submitButton">
          ПОЛУЧИТЬ НОМЕР
        </button>

        <div class="error" id="error"></div>

      </form>

    </div>

    <div class="footer">
      NAVAT • ASTANA
    </div>

  </div>


  <div class="result" id="result">

    <div class="star">★</div>

    <div class="logo">NAVAT</div>

    <div class="success-card">

      <div class="success-icon">✦</div>

      <div class="success-title">
        ВЫ УЧАСТВУЕТЕ!
      </div>

      <div class="number-label">
        ВАШ НОМЕР УЧАСТНИКА
      </div>

      <div class="number" id="participantNumber">
        —
      </div>

      <div class="save-text">
        Сохраните этот номер.
      </div>

    </div>

    <div class="footer">
      NAVAT • ASTANA
    </div>

  </div>

</div>


<script>

const SUPABASE_URL = "https://wvcvpkccwvjtmlsgvcui.supabase.co";
const SUPABASE_KEY = "sb_publishable_m1eT92AFoxx5600HvlWkfw_zWVyCOdp";

const form = document.getElementById("form");
const button = document.getElementById("submitButton");
const error = document.getElementById("error");

form.addEventListener("submit", async function(e) {

  e.preventDefault();

  error.textContent = "";

  button.disabled = true;
  button.textContent = "РЕГИСТРАЦИЯ...";

  const fullName =
    document.getElementById("full_name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const instagram =
    document.getElementById("instagram").value.trim();

  try {

    const checkResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/participants?select=participant_number&order=participant_number.desc&limit=1`,
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!checkResponse.ok) {
      const details = await checkResponse.text();
      throw new Error(
        "Supabase: " +
        checkResponse.status +
        " — " +
        details
      );
    }

    const previous = await checkResponse.json();

    let nextNumber = 1;

    if (
      previous.length > 0 &&
      previous[0].participant_number
    ) {
      nextNumber =
        Number(previous[0].participant_number) + 1;
    }

    const saveResponse = await fetch(
      `${SUPABASE_URL}/rest/v1/participants`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`,
          "Prefer": "return=representation"
        },

        body: JSON.stringify({
          full_name: fullName,
          phone: phone,
          instagram: instagram,
          participant_number: nextNumber
        })
      }
    );

    if (!saveResponse.ok) {
      const details = await saveResponse.text();

      throw new Error(
        "Supabase: " +
        saveResponse.status +
        " — " +
        details
      );
    }

    document.getElementById("registration")
      .style.display = "none";

    document.getElementById("result")
      .style.display = "block";

    document.getElementById("participantNumber")
      .textContent =
      String(nextNumber).padStart(3, "0");

  } catch (err) {

    console.error(err);

    error.textContent =
      "Ошибка: " + err.message;

    button.disabled = false;
    button.textContent = "ПОЛУЧИТЬ НОМЕР";
  }

});

</script>

</body>
</html>
